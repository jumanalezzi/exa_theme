
    <style>
        /* حقن التفضيلات كمتغيرات CSS ديناميكية */
        :root {
            --bg-main: #e1edf8;
            --text-main: #0b3d91;
            --text-muted: #546e7a;
            --border-color: #bbdefb;
            
            --link-color: #1565c0;
            --link-hover: #0b3d91;
            
            --btn-bg: #0b3d91;
            --btn-text: #ffffff;
            --btn-hover-bg: #1565c0;
            --btn-hover-text: #ffffff;
            
            --card-bg: #ffffff;
            --card-radius: 12px;
            --card-shadow: 0 4px 12px rgba(11, 61, 145, 0.05);
            
            --table-header-bg: #0b3d91;
            --table-header-text: #ffffff;
            --table-row-bg: #ffffff;
            --table-row-alt: #f4f8fc;
            --table-border: #e3f2fd;
            
            --input-bg: #ffffff;
            --input-text: #0b3d91;
            --input-radius: 6px;
            --input-border-color: #bbdefb;
            
            --badge-draft-bg: #eceff1;
            --badge-draft-text: #455a64;
        }

        /* التنسيقات العامة للحاوية مخصصة للحقن داخل السايدبار */
        .invoice-dashboard-container {
            font-family:var(--main-font, 'Cairo', sans-serif) !important;
            background-color: var(--content-bg) !important;
            color: var(--content-text)!important;
            padding: 24px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* الهيدر العلوي */
        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .invoice-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .invoice-title-area h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .status-badge {
            background-color: var(--badge-draft-bg);
            color: var(--badge-draft-text);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-main {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            border-radius: var(--input-radius);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-main:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        /* البطاقات الإدارية */
        .invoice-card {
            background-color: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--table-border);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--table-border);
            padding-bottom: 10px;
        }

        /* شبكة المدخلات */
        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-control {
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--input-border-color);
            border-radius: var(--input-radius);
            padding: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--btn-bg);
        }

        /* الجداول الاحترافية */
        .table-responsive {
            overflow-x: auto;
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        .invoice-table th {
            background-color: var(--table-header-bg);
            color: var(--table-header-text);
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .invoice-table th:first-child { border-top-right-radius: var(--input-radius); border-bottom-right-radius: var(--input-radius); }
        .invoice-table th:last-child { border-top-left-radius: var(--input-radius); border-bottom-left-radius: var(--input-radius); }
        
        .invoice-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--table-border);
            font-size: 14px;
            background-color: var(--table-row-bg);
        }
        .invoice-table tr:nth-child(even) td {
            background-color: var(--table-row-alt);
        }
        .table-input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--input-text);
            padding: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .table-input:focus {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border-color);
            border-radius: var(--input-radius);
            outline: none;
        }

        /* ملخص الإجماليات */
        .totals-section {
            display: flex;
            justify-content: flex-end;
        }
        .totals-box {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
        }
        .total-row.grand-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 4px;
        }
    </style>


<div class="invoice-dashboard-container">
    
    <header class="invoice-header">
        <div class="invoice-title-area">
            <h2>فاتورة مبيعات جديدة</h2>
            <span class="status-badge">مسودة</span>
        </div>
        <div class="action-buttons">
            <button class="btn-main"><i class="fas fa-save"></i> حفظ الفاتورة</button>
        </div>
    </header>

    <section class="invoice-card">
        <h3 class="card-title"><i class="fas fa-info-circle"></i> البيانات الأساسية</h3>
        <div class="inputs-grid">
            <div class="form-group">
                <label>العميل</label>
                <input type="text" class="form-control" placeholder="اختر العميل...">
            </div>
            <div class="form-group">

            </div>
            <div class="form-group">
                <label>تاريخ الاستحقاق</label>
                <input type="date" class="form-control">
            </div>
            <div class="form-group">
                <label>العملة</label>
                <input type="text" class="form-control" value="YER">
            </div>
        </div>
    </section>

    <section class="invoice-card">
        <h3 class="card-title"><i class="fas fa-box-open"></i> بنود المواد والخدمات</h3>
        <div class="table-responsive">
            <table class="invoice-table">
                <thead>
                    <tr>
                        <th style="width: 5%">#</th>
                        <th style="width: 45%">الصنف / البيان</th>
                        <th style="width: 15%">الكمية</th>
                        <th style="width: 15%">السعر القياسي</th>
                        <th style="width: 20%">المجموع الإجمالي</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><input type="text" class="table-input" value="تطوير واجهة مستخدم مخصصة - لوحة تحكم"></td>
                        <td><input type="number" class="table-input" value="1"></td>
                        <td><input type="number" class="table-input" value="150000"></td>
                        <td style="font-weight: 600;">150,000</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td><input type="text" class="table-input" placeholder="اضغط لإضافة صنف جديد..."></td>
                        <td><input type="number" class="table-input"></td>
                        <td><input type="number" class="table-input"></td>
                        <td style="font-weight: 600;">0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="invoice-card totals-section">
        <div class="totals-box">
            <div class="total-row">
                <span>المجموع الإجمالي (صافي):</span>
                <span>150,000</span>
            </div>
            <div class="total-row">
                <span>إجمالي ضريبة القيمة المضافة (15%):</span>
                <span>22,500</span>
            </div>
            <div class="total-row grand-total">
                <span>المجموع الكلي:</span>
                <span>172,500 YER</span>
            </div>
        </div>
    </section>

</div>
