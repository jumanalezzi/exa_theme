<div class="madar-wrapper">
    <header class="madar-header">
    {% include "exa_theme/www/header.html" %}
    </header>
<div class="main-layout-container ">
    <aside class="madar-sidebar" id="mainSidebar">
        {% include "exa_theme/www/sidebar.html" %}
</aside>
       <main class="madar-content" id="madarMainDisplay" style="position: relative; width: 100%; height: 100%;">
    
    <div id="madarLoader" class="display-view splash-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; justify-content: center; align-items: center; z-index: 100;">
        <img src="{{ settings.light_logo if user_pref.madar_theme == 'Light' else settings.dark_logo }}" class="pulse-logo" alt="Logo">
    </div>

    <iframe id="systemFrame" class="display-view" style="width: 100%; height: 100%; border: none; display: none;" src="/app" onload="syncIframeThemeOnLoad()"></iframe>

    <div id="customContentContainer" class="display-view" style="display: none; position: relative; z-index: 2; height: 100%; width: 100%; overflow-y: auto; overflow-x: hidden; background-color: var(--bg-color);"></div>

</main>
    </div>
