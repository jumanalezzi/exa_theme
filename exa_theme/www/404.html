<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 50px 35px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.06);
        }
        .error-code {
            font-size: 88px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #0d6efd 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        .error-icon {
            font-size: 40px;
            color: #0d6efd;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-custom {
            border-radius: 10px;
            padding: 11px 24px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 class="error-title">عفواً، الصفحة المطلوبة غير موجودة</h1>
        <p class="error-desc">الصفحة التي تبحث عنها غير متوفرة في النظام أو قد تم نقلها أو حذفها.</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/exa" class="btn btn-primary btn-custom">
                <i class="fa-solid fa-house"></i> العودة للرئيسية
            </a>
            <button onclick="window.history.back()" class="btn btn-outline-secondary btn-custom">
                <i class="fa-solid fa-arrow-right"></i> الصفحة السابقة
            </button>
        </div>
    </div>
</body>
</html>
